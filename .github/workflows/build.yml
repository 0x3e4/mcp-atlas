name: build-images

# Check, test, then build every *-mcp server image, push it to GHCR (ghcr.io/<owner>/<server>) with an SBOM
# and build provenance, and sign it (keyless cosign, GitHub OIDC).
# Images are consumed by each server's compose.yml.example.
on:
  push:
    branches: [main]
    paths:
      - "*-mcp/**"
      - "_shared/**"
      - "_template/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Guard copies match _shared/atlas_guard.py
        run: python scripts/sync_shared.py --check

      - name: README server table shows every server's current version
        run: python scripts/sync_readme_versions.py --check

      - name: Known vulnerabilities in the locks (OSV)
        run: python scripts/osv_check.py

      - name: Shared guard and template tests (in a locked environment)
        working-directory: audiocodes-sbc-mcp
        run: |
          pip install "poetry==2.5.1"
          poetry install --no-interaction
          poetry run python -m pytest -q ../_shared/tests
          PYTHONPATH=../_template/src poetry run python -m pytest -q ../_template/tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - atlas-hub-mcp
          - audiocodes-sbc-mcp
          - azure-devops-mcp
          - bookstack-mcp
          - defender-mcp
          - fortigate-mcp
          - netbox-mcp
          - netscaler-console-mcp
          - netscaler-mcp
          - prtg-mcp
          - snipeit-mcp
          - vcenter-mcp
          - wazuh-mcp
          - zammad-mcp
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Test ${{ matrix.server }} against its poetry.lock
        working-directory: ${{ matrix.server }}
        run: |
          pip install "poetry==2.5.1"
          poetry check --lock
          poetry install --no-interaction
          poetry run python -m pytest -q

  build:
    needs: [checks, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless signing with the workflow's OIDC identity
    strategy:
      fail-fast: false
      matrix:
        server:
          - atlas-hub-mcp
          - audiocodes-sbc-mcp
          - azure-devops-mcp
          - bookstack-mcp
          - defender-mcp
          - fortigate-mcp
          - netbox-mcp
          - netscaler-console-mcp
          - netscaler-mcp
          - prtg-mcp
          - snipeit-mcp
          - vcenter-mcp
          - wazuh-mcp
          - zammad-mcp
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the server version
        id: version
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("${{ matrix.server }}/pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.server }}
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./${{ matrix.server }}
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.server }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.server }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.server }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.server }}
          cache-to: type=gha,mode=max,scope=${{ matrix.server }}

      - uses: sigstore/cosign-installer@v4.1.3

      - name: Sign the image (keyless)
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/${{ matrix.server }}@${{ steps.build.outputs.digest }}"
