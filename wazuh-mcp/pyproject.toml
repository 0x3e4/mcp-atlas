[project]
name = "wazuh-mcp"
version = "1.0.0"
description = "Lightweight MCP server for querying Wazuh alerts, archives, and management data, with opt-in agent write actions"
authors = [{ name = "cai", email = "cai@nohub.lol" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "httpx>=0.28",
]

[project.scripts]
wazuh-mcp = "wazuh_mcp.server:main"

[tool.poetry]
packages = [{ include = "wazuh_mcp", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
